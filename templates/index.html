<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه هوشمند استخراج متن و پردازش فرم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #f8fafc;
        }
        /* استایل اختصاصی برای اسکرول‌بار بخش جی‌سان */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col">

    <header class="bg-white border-b border-slate-200 py-5 px-6 shadow-sm">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2.5 rounded-xl text-white shadow-md shadow-blue-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900">تشخیص هوشمند متن فارسی و ساختار فرم</h1>
                    <p class="text-xs text-slate-500 mt-0.5">Advanced Persian OCR & Structured JSON Extractor</p>
                </div>
            </div>
            <button onclick="fetchStats()" class="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-sm font-medium transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2h2a2 2 0 002-2zm12 0v-11a2 2 0 00-2-2h-2a2 2 0 00-2 2v11a2 2 0 002 2h2a2 2 0 002-2z" />
                </svg>
                مشاهده آمار و دقت سیستم
            </button>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <section class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex flex-col">
            <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                <span class="w-1.5 h-5 bg-blue-600 rounded-full"></span>
                بارگذاری سند یا تصویر فرم
            </h2>
            
            <label id="drop-zone" class="border-2 border-dashed border-slate-300 hover:border-blue-500 bg-slate-50 hover:bg-blue-50/30 rounded-xl p-8 flex flex-col items-center justify-center cursor-pointer transition-all group flex-grow min-h-[250px]">
                <input type="file" id="file-input" accept="image/*" class="hidden" onchange="previewImage(event)">
                
                <div class="bg-white p-4 rounded-full shadow-sm text-slate-400 group-hover:text-blue-600 group-hover:scale-110 transition-all mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a1 1 0 011.414 0L16 17m0 0l1-1m-1 1k-3-3m-3 3L15 12m0 0l4.586-4.586a1 1 0 011.414 0L24 16m-2 3H2a2 2 0 01-2-2V7a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                </div>
                <span class="text-sm font-bold text-slate-700">تصویر را به اینجا بکشید یا کلیک کنید</span>
                <span class="text-xs text-slate-400 mt-1">پشتیبانی از فرمت‌های PNG، JPG و JPEG</span>
            </label>

            <div id="preview-container" class="hidden mt-4 relative border border-slate-200 rounded-xl overflow-hidden bg-slate-100 flex-grow">
                <img id="image-preview" src="#" alt="پیش‌نمایش تصویر" class="w-full h-auto max-h-[400px] object-contain mx-auto">
                <button onclick="resetUpload()" class="absolute top-3 left-3 bg-rose-600 hover:bg-rose-700 text-white p-2 rounded-xl shadow-md transition-all text-xs flex items-center gap-1 font-medium">
                    حذف و تغییر عکس
                </button>
            </div>

            <button id="process-btn" onclick="uploadImage()" disabled class="w-full mt-5 bg-blue-600 hover:bg-blue-700 text-white disabled:bg-slate-200 disabled:text-slate-400 py-3 rounded-xl font-bold shadow-lg shadow-blue-200 disabled:shadow-none transition-all flex items-center justify-center gap-2">
                پردازش و استخراج داده‌ها
            </button>
        </section>

        <section class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex flex-col min-h-[400px]">
            <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                <span class="w-1.5 h-5 bg-emerald-500 rounded-full"></span>
                اطلاعات استخراج شده (JSON Output)
            </h2>

            <div id="loading" class="hidden flex-grow flex flex-col items-center justify-center gap-3">
                <div class="w-10 h-10 border-4 border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
                <p class="text-sm text-slate-500 animate-pulse font-medium">هوش مصنوعی در حال تحلیل عکس و ساختار فرم است...</p>
            </div>

            <div id="json-container" class="flex-grow flex flex-col">
                <textarea id="json-output" readonly dir="ltr" class="w-full flex-grow p-4 bg-slate-900 text-emerald-400 font-mono text-sm rounded-xl border border-slate-800 focus:outline-none custom-scrollbar resize-none placeholder-slate-600 min-h-[350px]" placeholder="// خروجی ساختاریافته در این قسمت نمایش داده می‌شود..."></textarea>
            </div>
        </section>
    </main>

    <div id="stats-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl border border-slate-100 relative animate-in fade-in duration-200">
            <h3 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">📊 گزارش و آمار سیستم</h3>
            <div class="space-y-3" id="stats-content">
                </div>
            <button onclick="closeModal()" class="w-full mt-6 bg-slate-900 hover:bg-slate-800 text-white py-2.5 rounded-xl font-bold text-sm transition-all">
                بستن پنجره آمار
            </button>
        </div>
    </div>

    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400 font-medium">
        سامانه پردازش مالتی‌مدیال ابری © 2026
    </footer>

    <script>
        let selectedFile = null;

        // نمایش عکس و فعال‌سازی دکمه پردازش پس از انتخاب فایل
        function previewImage(event) {
            const input = event.target;
            if (input.files && input.files[0]) {
                selectedFile = input.files[0];
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    document.getElementById('image-preview').src = e.target.result;
                    document.getElementById('drop-zone').classList.add('hidden');
                    document.getElementById('preview-container').classList.remove('hidden');
                    document.getElementById('process-btn').disabled = false;
                }
                reader.readAsDataURL(selectedFile);
            }
        }

        // بازگرداندن باکس آپلود به حالت اولیه
        function resetUpload() {
            selectedFile = null;
            document.getElementById('file-input').value = '';
            document.getElementById('drop-zone').classList.remove('hidden');
            document.getElementById('preview-container').classList.add('hidden');
            document.getElementById('process-btn').disabled = true;
            document.getElementById('json-output').value = '';
        }

        // ارسال عکس به Endpoint سرور فلاسکتان برای استخراج کلید-مقدار فارسی/انگلیسی
        async function uploadImage() {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('image', selectedFile);

            // تغییر وضعیت المان‌ها به حالت بارگذاری
            document.getElementById('json-container').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('process-btn').disabled = true;

            try {
                // ارسال درخواست به نقطه پایانی محلی شما
                const response = await fetch('/ocr', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('خطا در پردازش تصویر از سمت سرور هوش مصنوعی.');
                }

                const data = await response.json();
                // نمایش خروجی جی‌سان به صورت کاملاً هماهنگ شده با ایندنت‌گذاری بی عیب و نقص
                document.getElementById('json-output').value = JSON.stringify(data, null, 4);
            } catch (error) {
                document.getElementById('json-output').value = JSON.stringify({"error": error.message}, null, 4);
            } finally {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('json-container').classList.remove('hidden');
                document.getElementById('process-btn').disabled = false;
            }
        }

        // واکشی میانگین دقت کل از دیتابیس SQLite سیستم شما (/stats)
        async function fetchStats() {
            document.getElementById('stats-modal').classList.remove('hidden');
            const content = document.getElementById('stats-content');
            content.innerHTML = '<p class="text-sm text-slate-500 text-center animate-pulse py-4">در حال دریافت آخرین محاسبات پایگاه داده...</p>';

            try {
                const response = await fetch('/stats');
                const data = await response.json();
                
                content.innerHTML = `
                    <div class="flex justify-between items-center bg-blue-50/50 p-3 rounded-xl border border-blue-100">
                        <span class="text-sm font-medium text-slate-600">میانگین دقت کل فرم‌ها:</span>
                        <span class="text-base font-bold text-blue-600 dir-ltr">${data.average_accuracy_percent}</span>
                    </div>
                    <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <span class="text-sm font-medium text-slate-600">تعداد فرم‌های پردازش شده:</span>
                        <span class="text-base font-bold text-slate-800">${data.total_processed_forms} فرم</span>
                    </div>
                    <div class="flex justify-between items-center bg-emerald-50/50 p-3 rounded-xl border border-emerald-100">
                        <span class="text-sm font-medium text-slate-600">بالاترین دقت ثبت شده تاکنون:</span>
                        <span class="text-base font-bold text-emerald-600 dir-ltr">${data.highest_accuracy_recorded}</span>
                    </div>
                `;
            } catch (error) {
                content.innerHTML = '<p class="text-sm text-rose-600 text-center">خطا در ارتباط با دیتابیس آمار سیستم.</p>';
            }
        }

        function closeModal() {
            document.getElementById('stats-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
